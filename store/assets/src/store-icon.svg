<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Chrome Web Store icon: 96x96 artwork centered in a transparent 128x128 canvas. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <clipPath id="shield">
      <path id="shape" d="M64 16C77 24 91 27 104 28V60C104 86 87 103 64 112C41 103 24 86 24 60V28C37 27 51 24 64 16Z"/>
    </clipPath>
  </defs>
  <!-- White edge keeps the shield visible on the store's dark theme. -->
  <use href="#shape" fill="url(#fill)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <!-- Lighter left half gives the classic two-tone shield. -->
  <rect x="0" y="0" width="64" height="128" fill="#ffffff" fill-opacity="0.1" clip-path="url(#shield)"/>
  <path d="M45 63L58 76L84 48" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
