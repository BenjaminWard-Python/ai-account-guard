<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Account Guard unit tests</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>
  <h1>Unit tests: config and rules</h1>
  <p id="summary"></p>
  <ul id="results"></ul>
  <script src="../extension/shared/providers.js"></script>
  <script src="../extension/shared/config.js"></script>
  <script src="../extension/shared/dashboard.js"></script>
  <script src="../extension/shared/rules.js"></script>
  <script src="assert.js"></script>
  <script>
    const G = AIGuard;
    const cfg = (overrides) => G.normalizeConfig({ AllowedDomains: ["example.org"], ...overrides });

    // ---- config ----
    test("no domains are allowed until an admin configures them", () => {
      const c = G.normalizeConfig({});
      assertEqual(c.AllowedDomains, []);
      assert(!G.isEmailAllowed("someone@example.org", c));
    });
    test("email domain matching is exact and case-insensitive", () => {
      const c = cfg();
      assert(G.isEmailAllowed("ben@example.org", c));
      assert(G.isEmailAllowed("  BEN@Example.ORG ", c));
      assert(!G.isEmailAllowed("ben@gmail.com", c));
      assert(!G.isEmailAllowed("ben@example.org.evil.com", c), "suffix attack");
      assert(!G.isEmailAllowed("ben@evilexample.org", c), "prefix attack");
      assert(!G.isEmailAllowed("ben@mail.example.org", c), "subdomain not allowed without *.");
      assert(!G.isEmailAllowed("example.org", c), "no @");
      assert(!G.isEmailAllowed("ben@", c));
    });
    test("wildcard entries allow the domain and its subdomains", () => {
      const c = cfg({ AllowedDomains: ["*.county.gov"] });
      assert(G.isEmailAllowed("a@county.gov", c));
      assert(G.isEmailAllowed("a@parks.county.gov", c));
      assert(!G.isEmailAllowed("a@badcounty.gov", c));
    });
    test("unicode look-alike domains are not treated as allowed", () => {
      // Cyrillic 'а' in place of Latin 'a'
      assert(!G.isEmailAllowed("ben@exаmple.org", cfg()));
    });
    test("allowed domains are normalized and junk dropped", () => {
      assertEqual(cfg({ AllowedDomains: ["@Example.ORG", " *.Foo.com ", "", "bad domain", "a@b.com"] }).AllowedDomains,
        ["example.org", "*.foo.com"]);
      assertEqual(cfg({ AllowedDomains: "a.org, b.org" }).AllowedDomains, ["a.org", "b.org"]);
    });
    test("empty AllowedDomains blocks everything", () => {
      const c = cfg({ AllowedDomains: [] });
      assert(!G.isEmailAllowed("ben@example.org", c));
      assert(!G.identityProviderAllowed("google", c), "google needs at least one domain");
    });
    test("portal URL must be http(s)", () => {
      assertEqual(cfg({ SsoPortalUrl: "javascript:alert(1)" }).SsoPortalUrl, "");
      assertEqual(cfg({ SsoPortalUrl: "https://myapps.microsoft.com" }).SsoPortalUrl, "https://myapps.microsoft.com/");
    });
    test("provider modes fall back to defaults and ignore bad values", () => {
      const c = cfg({ ProviderModes: { deepseek: "block", chatgpt: "nonsense" } });
      assertEqual(c.ProviderModes.deepseek, "block");
      assertEqual(c.ProviderModes.chatgpt, "enforce");
      assertEqual(c.ProviderModes.meta, "block");
    });
    test("microsoft sign-in requires a tenant id", () => {
      assert(!G.identityProviderAllowed("microsoft", cfg({ AllowMicrosoftSignIn: true })));
      assert(G.identityProviderAllowed("microsoft", cfg({ AllowMicrosoftSignIn: true, MicrosoftTenantId: "abc" })));
      assert(!G.identityProviderAllowed("microsoft-personal", cfg({ AllowMicrosoftSignIn: true, MicrosoftTenantId: "abc" })));
    });
    // loadConfig with a mocked chrome.storage / chrome.management.
    async function loadWith({ managed = {}, local = {}, installType = "normal", store = {} }) {
      const saved = globalThis.chrome;
      const all = { settings: local, ...store };
      globalThis.chrome = {
        storage: {
          managed: { get: async () => managed },
          local: { get: async (k) => (typeof k === "string" ? { [k]: all[k] } : all) },
        },
        management: { getSelf: async () => ({ installType }) },
      };
      try {
        return await G.loadConfig();
      } finally {
        globalThis.chrome = saved;
      }
    }
    test("loadConfig: managed policy wins over local settings", async () => {
      const r = await loadWith({ managed: { AllowedDomains: ["corp.org"] }, local: { AllowedDomains: ["me.com"] }, installType: "admin" });
      assertEqual(r.source, "managed");
      assertEqual(r.config.AllowedDomains, ["corp.org"]);
    });
    test("loadConfig: IT-installed without policy ignores local settings and blocks everything", async () => {
      const r = await loadWith({ local: { AllowedDomains: ["gmail.com"], ProviderModes: { deepseek: "enforce" } }, installType: "admin" });
      assertEqual(r.source, "awaiting-policy");
      assertEqual(r.config.AllowedDomains, []);
    });
    test("loadConfig: self-installed uses local settings", async () => {
      const r = await loadWith({ local: { AllowedDomains: ["smallorg.org"] }, installType: "normal" });
      assertEqual(r.source, "local");
      assertEqual(r.config.AllowedDomains, ["smallorg.org"]);
    });
    test("loadConfig: self-installed with nothing saved uses defaults", async () => {
      const r = await loadWith({ installType: "normal" });
      assertEqual(r.source, "default");
    });

    // ---- status panel ----
    const report = (over) => G.statusReport({ version: "0.1.4", extensionId: "id", installType: "admin", source: "managed", ...over });
    const problemText = (r) => r.problems.map((p) => p.text).join(" | ");
    test("status: healthy managed install has no problems", () => {
      const r = report({ config: cfg({ AllowMicrosoftSignIn: true, MicrosoftTenantId: "t", AllowGoogleSignIn: false }) });
      assertEqual(r.problems, []);
      assert(r.rows.find((x) => x.label === "Settings").state === "ok");
      assert(r.rows.find((x) => x.label === "Sign in with Microsoft").value.includes("tenant t"));
      assert(r.text.includes("Version: 0.1.4"), "summary for tickets");
    });
    test("status: IT install without settings explains the fix", () => {
      const r = report({ config: G.normalizeConfig({}), source: "awaiting-policy" });
      assert(/settings haven't arrived/.test(problemText(r)));
      assert(r.problems[0].fix.includes("chrome://policy") && r.problems[0].fix.includes(G.SETUP_URL));
      assertEqual(r.problems.length, 1, "no duplicate 'no domains' problem");
    });
    test("status: managed settings without domains", () => {
      const r = report({ config: G.normalizeConfig({ OrganizationName: "X" }) });
      assert(/don't list any approved email domains/.test(problemText(r)));
    });
    test("status: Microsoft on without tenant ID", () => {
      const r = report({ config: cfg({ AllowMicrosoftSignIn: true }) });
      assert(/no tenant ID/.test(problemText(r)));
      assertEqual(r.rows.find((x) => x.label === "Sign in with Microsoft").state, "warn");
    });
    test("status: managed settings but not force-installed", () => {
      const r = report({ config: cfg(), installType: "normal" });
      assert(/isn't force-installed/.test(problemText(r)));
    });
    test("status: self-installed with local settings is fine", () => {
      const r = report({ config: cfg(), source: "local", installType: "normal" });
      assertEqual(r.problems, []);
    });
    test("status: not set up", () => {
      const r = report({ config: G.normalizeConfig({}), source: "default", installType: "normal" });
      assert(/isn't set up/.test(problemText(r)));
    });

    // ---- sign-in recognition (labels seen on the real sign-in pages) ----
    const idOf = (label) => { const r = G.classifySignInLabel(label); return r && r.id ? r.id : r; };
    test("sign-in labels from real AI login pages are classified", () => {
      assertEqual(idOf("Continue with Google"), "google");
      assertEqual(idOf("Log in with Google"), "google");
      assertEqual(idOf("Login with Apple"), "apple");
      assertEqual(idOf("Sign in with Microsoft"), "microsoft");
      assertEqual(idOf("Login with 𝕏"), "x");
      assertEqual(idOf("Login with GitHub"), "github");
      assertEqual(idOf("Use phone"), "phone");
      assertEqual(idOf("Continue with phone"), "phone");
      assertEqual(idOf("Continue with SSO"), "enterprise");
      assertEqual(idOf("Continue with email"), null);
      assertEqual(idOf("Login with email"), null);
      assertEqual(idOf("Continue with magic link"), null);
      assertEqual(idOf("Sign in with a code"), null);
      assertEqual(idOf("Log in with username"), null);
      assertEqual(idOf("Continue"), null);
    });
    test("unrecognized third-party sign-ins are blocked and named", () => {
      const m = G.classifySignInLabel("Continue with LinkedIn");
      assertEqual(m.id, "unknown");
      assertEqual(m.name, "LinkedIn");
      assertEqual(G.classifySignInLabel("Sign in with your Yahoo account").name, "Yahoo");
      assert(!G.identityProviderAllowed("unknown", cfg({ AllowGoogleSignIn: true })), "never allowed");
      assert(G.isUnrecognizedSignIn("Continue with LinkedIn"));
      assert(G.isUnrecognizedSignIn("Sign in with Passkey"));
      assert(!G.isUnrecognizedSignIn("Continue with Google"));
      assert(!G.isUnrecognizedSignIn("Continue with email"));
      assert(!G.isUnrecognizedSignIn("Continue with SSO"));
      assert(!G.isUnrecognizedSignIn("Send message"));
    });

    test("Copilot's current and old addresses are both covered", () => {
      assertEqual(G.providerForHost("copilot.com").id, "copilot");
      assertEqual(G.providerForHost("www.copilot.com").id, "copilot");
      assertEqual(G.providerForHost("copilot.microsoft.com").id, "copilot");
      const dyn = G.buildDynamicRules(cfg());
      const msBlock = dyn.find((r) => r.action.type === "redirect" && r.condition.requestDomains.includes("login.microsoftonline.com"));
      assert(msBlock.condition.initiatorDomains.includes("copilot.com"), "Microsoft sign-in started from copilot.com is blocked");
    });

    // ---- dashboard (0.2) ----
    // A throwaway signing key stands in for a dashboard at TEST_ORIGIN.
    const TEST_ORIGIN = "https://dashboard.test";
    const ORG = "aag_" + "k".repeat(43);
    const enc = new TextEncoder();
    const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const toB64url = (buf) => toB64(buf).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    let testKey = null;
    async function signedDoc(revision, settings, { orgKey = ORG, key = null } = {}) {
      if (!testKey) {
        testKey = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
        G.DASHBOARDS[TEST_ORIGIN] = toB64(await crypto.subtle.exportKey("spki", testKey.publicKey));
      }
      const payload = JSON.stringify({ v: 1, org: await G.sha256Hex(orgKey), revision, issuedAt: "2026-10-22T00:00:00Z", settings });
      const sig = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, (key || testKey).privateKey, enc.encode(payload));
      return { payload, signature: toB64url(sig) };
    }
    const dashSettings = (over = {}) => ({ ...G.normalizeConfig({ AllowedDomains: ["example.org", "example.net"], AllowGoogleSignIn: true }), ...over });
    const connected = { DashboardUrl: TEST_ORIGIN + "/", DashboardOrgKey: ORG };

    test("dashboard: only built-in dashboards and well-formed keys connect", () => {
      assertEqual(G.dashboardFromPolicy({}), null);
      assert(G.dashboardFromPolicy({ DashboardUrl: "https://evil.example", DashboardOrgKey: ORG }).invalid, "unknown dashboard");
      assert(G.dashboardFromPolicy({ DashboardUrl: "http://localhost:3200", DashboardOrgKey: "aag_short" }).invalid, "bad key");
      assert(!G.dashboardFromPolicy({ DashboardUrl: "http://localhost:3200/", DashboardOrgKey: ORG }).invalid, "dev dashboard");
    });
    test("dashboard: signed settings verify; tampered, wrong-org and wrong-key ones don't", async () => {
      const doc = await signedDoc(4, dashSettings());
      assertEqual((await G.verifyDashboardDocument(doc, ORG, TEST_ORIGIN)).revision, 4);
      const tampered = { ...doc, payload: doc.payload.replace('"chatgpt":"enforce"', '"chatgpt":"off"') };
      assertEqual(await G.verifyDashboardDocument(tampered, ORG, TEST_ORIGIN), null);
      assertEqual(await G.verifyDashboardDocument(doc, "aag_" + "z".repeat(43), TEST_ORIGIN), null);
      const otherKey = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
      assertEqual(await G.verifyDashboardDocument(await signedDoc(5, dashSettings(), { key: otherKey }), ORG, TEST_ORIGIN), null);
      assertEqual(await G.verifyDashboardDocument(doc, ORG, "http://localhost:3200"), null, "signed for another dashboard");
    });
    test("dashboard: blocks everything until verified settings arrive", async () => {
      const r = await loadWith({ managed: connected, installType: "admin" });
      assertEqual(r.source, "awaiting-dashboard");
      assertEqual(r.config.AllowedDomains, []);
      const forged = await loadWith({ managed: connected, installType: "admin", store: { dashboard: { payload: '{"v":1}', signature: "AAAA" } } });
      assertEqual(forged.source, "awaiting-dashboard", "a forged copy in local storage is ignored");
    });
    test("dashboard: verified settings are used", async () => {
      const r = await loadWith({ managed: connected, installType: "admin", store: { dashboard: { ...(await signedDoc(7, dashSettings())), coverage: true } } });
      assertEqual(r.source, "dashboard");
      assertEqual(r.dashboard.revision, 7);
      assertEqual(r.dashboard.coverage, true);
      assertEqual(r.config.AllowedDomains, ["example.org", "example.net"]);
    });
    test("dashboard: a deployed floor can only be tightened", async () => {
      const dash = dashSettings({ ProviderModes: { ...dashSettings().ProviderModes, chatgpt: "off", deepseek: "enforce" }, TenantRestrictionScope: "ai-sites" });
      const floor = { AllowedDomains: ["example.org"], AllowGoogleSignIn: false, TenantRestrictionScope: "all-browsing", ProviderModes: { chatgpt: "enforce", deepseek: "block" } };
      const out = G.applyFloor(dash, floor);
      assertEqual(out.AllowedDomains, ["example.org"], "dashboard can't add domains");
      assertEqual(out.AllowGoogleSignIn, false, "dashboard can't allow Google");
      assertEqual(out.TenantRestrictionScope, "all-browsing");
      assertEqual(out.ProviderModes.chatgpt, "enforce", "off can't loosen enforce");
      assertEqual(out.ProviderModes.deepseek, "block");
      assertEqual(out.ProviderModes.claude, dash.ProviderModes.claude, "services the floor doesn't name are untouched");
      const r = await loadWith({ managed: { ...connected, ...floor }, installType: "admin", store: { dashboard: await signedDoc(8, dash) } });
      assertEqual(r.config.AllowedDomains, ["example.org"]);
      assert(r.dashboard.floor);
    });
    test("dashboard: the developer stand-in for policy works only for unpacked installs", async () => {
      const store = { devManaged: connected, dashboard: await signedDoc(9, dashSettings()) };
      assertEqual((await loadWith({ installType: "development", store })).source, "dashboard");
      assertEqual((await loadWith({ installType: "normal", store })).source, "default");
      assertEqual((await loadWith({ installType: "admin", store })).source, "awaiting-policy");
    });
    test("status: dashboard problems carry codes the dashboard understands", () => {
      const codes = (over) => G.statusReport({ config: cfg(), installType: "admin", ...over }).problems.map((p) => p.code);
      assertEqual(codes({ source: "awaiting-dashboard", config: G.normalizeConfig({}), dashboard: { origin: TEST_ORIGIN } }), ["awaiting-dashboard"]);
      assertEqual(codes({ source: "dashboard", dashboard: { origin: TEST_ORIGIN, revision: 3, error: "unreachable" } }), ["dashboard-unreachable"]);
      assertEqual(codes({ source: "dashboard", dashboard: { origin: TEST_ORIGIN, revision: 3, error: "bad-signature" } }), ["bad-signature"]);
      assertEqual(codes({ source: "awaiting-dashboard", config: G.normalizeConfig({}), dashboard: { invalid: true } }), ["dashboard-not-allowed"]);
      assertEqual(codes({ source: "dashboard", installType: "normal", dashboard: { origin: TEST_ORIGIN, revision: 3 } }), ["not-force-installed"]);
    });

    test("provider lookup by host", () => {
      assertEqual(G.providerForHost("chatgpt.com").id, "chatgpt");
      assertEqual(G.providerForHost("auth.openai.com").id, "chatgpt");
      assertEqual(G.providerForHost("www.perplexity.ai").id, "perplexity");
      assertEqual(G.providerForHost("gemini.google.com").id, "gemini");
      assertEqual(G.providerForHost("mail.google.com"), null);
      assertEqual(G.providerForHost("notchatgpt.com"), null);
    });

    // ---- rules ----
    const find = (rules, pred) => rules.filter(pred);
    const redirectsTo = (r, s) => r.action.type === "redirect" && r.action.redirect.extensionPath.includes(s);

    function validate(rules) {
      const ids = new Set();
      for (const r of rules) {
        assert(Number.isInteger(r.id) && r.id > 0, "id " + r.id);
        assert(!ids.has(r.id), "duplicate id " + r.id);
        ids.add(r.id);
        assert(r.condition.resourceTypes && r.condition.resourceTypes.length, "resourceTypes");
        for (const d of [...(r.condition.requestDomains || []), ...(r.condition.initiatorDomains || [])]) {
          assert(d === d.toLowerCase() && !d.includes("*"), "bad domain " + d);
        }
        for (const h of (r.action.requestHeaders || [])) assert(h.value, "empty header " + h.header);
      }
    }

    test("default config: blocked sites, blocked SSO, google header scoped to AI sites", () => {
      const rules = G.buildDynamicRules(cfg());
      validate(rules);
      assert(find(rules, (r) => redirectsTo(r, "reason=site&provider=meta")).length === 1, "meta blocked");
      assert(!find(rules, (r) => redirectsTo(r, "provider=chatgpt")).length, "chatgpt not blocked");

      const apple = find(rules, (r) => redirectsTo(r, "idp=apple"));
      assertEqual(apple.length, 1);
      assert(apple[0].condition.initiatorDomains.includes("chatgpt.com"), "apple rule scoped to AI initiators");
      assert(!apple[0].condition.initiatorDomains.includes("meta.ai"), "blocked sites are not AI context");

      assert(find(rules, (r) => redirectsTo(r, "idp=microsoft")).length, "microsoft blocked w/o tenant");
      assert(find(rules, (r) => redirectsTo(r, "idp=microsoft-personal")).length, "MSA always blocked");
      assert(!find(rules, (r) => redirectsTo(r, "idp=google")).length, "google allowed by default");

      const g = find(rules, (r) => r.action.type === "modifyHeaders");
      assertEqual(g.length, 1);
      assertEqual(g[0].action.requestHeaders[0], { header: "X-GoogApps-Allowed-Domains", operation: "set", value: "example.org" });
      assert(g[0].condition.initiatorDomains.includes("gemini.google.com"));
      assert(g[0].condition.resourceTypes.includes("main_frame"), "headers must apply to navigations");
    });

    test("all-browsing scope applies headers without an initiator condition", () => {
      const rules = G.buildDynamicRules(cfg({ TenantRestrictionScope: "all-browsing" }));
      validate(rules);
      const g = find(rules, (r) => r.action.type === "modifyHeaders");
      assertEqual(g.length, 1);
      assertEqual(g[0].condition.initiatorDomains, undefined);
    });

    test("microsoft allowed: tenant headers, work sign-in unblocked, personal still blocked", () => {
      const rules = G.buildDynamicRules(cfg({ AllowMicrosoftSignIn: true, MicrosoftTenantId: "tid-123", AllowedDomains: ["a.org", "*.b.org"] }));
      validate(rules);
      assert(!find(rules, (r) => redirectsTo(r, "idp=microsoft&") || r.action.redirect?.extensionPath.endsWith("idp=microsoft")).length);
      assert(find(rules, (r) => redirectsTo(r, "idp=microsoft-personal")).length);
      const ms = find(rules, (r) => r.action.requestHeaders?.some((h) => h.header === "Restrict-Access-Context"))[0];
      assertEqual(ms.action.requestHeaders, [
        { header: "Restrict-Access-To-Tenants", operation: "set", value: "a.org,b.org" },
        { header: "Restrict-Access-Context", operation: "set", value: "tid-123" },
      ]);
    });

    test("google disallowed: google sign-in blocked, no header", () => {
      const rules = G.buildDynamicRules(cfg({ AllowGoogleSignIn: false }));
      assert(find(rules, (r) => redirectsTo(r, "idp=google")).length);
      assert(!find(rules, (r) => r.action.type === "modifyHeaders").length);
    });

    test("session rules mirror context rules for tagged tabs", () => {
      assertEqual(G.buildSessionRules(cfg(), []), []);
      const rules = G.buildSessionRules(cfg(), [7, 9]);
      validate(rules);
      assert(rules.length > 0);
      assert(rules.every((r) => r.id > 10000 && JSON.stringify(r.condition.tabIds) === "[7,9]" && !r.condition.initiatorDomains));
      const dynamicContext = G.buildDynamicRules(cfg()).filter((r) => r.condition.initiatorDomains);
      assertEqual(rules.length, dynamicContext.length);
    });

    test("all services off: no AI context rules", () => {
      const modes = Object.fromEntries(G.PROVIDERS.map((p) => [p.id, "off"]));
      assertEqual(G.buildDynamicRules(cfg({ ProviderModes: modes })), []);
    });

    run();
  </script>
</body>
</html>
