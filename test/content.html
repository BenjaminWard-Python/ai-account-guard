<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Account Guard content script tests</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>
  <h1>Content script tests (simulated chatgpt.com)</h1>
  <p id="summary"></p>
  <ul id="results"></ul>

  <div id="fixtures">
    <!-- Classic form login -->
    <form id="form1">
      <input type="email" id="email1" name="email">
      <button type="submit" id="submit1">Continue</button>
    </form>

    <!-- SPA login: no form, button with its own click handler -->
    <div id="spa">
      <input type="text" id="email2" name="username" autocomplete="username">
      <div role="button" id="continue2" tabindex="0">Continue</div>
    </div>

    <!-- Third-party sign-in buttons -->
    <div id="sso">
      <button id="google"><svg width="10" height="10"></svg><span>Continue with Google</span></button>
      <button id="microsoft">Continue with Microsoft Account</button>
      <button id="apple">Continue with Apple</button>
      <button id="phone">Continue with phone</button>
      <button id="enterprise">Continue with SSO</button>
      <button id="emailbtn">Continue with email</button>
      <a href="#" id="xlink">Sign in with X</a>
      <button id="unrelated">Send message</button>
    </div>

    <!-- Email field inside a shadow root -->
    <div id="shadowhost"></div>
  </div>

  <script src="../extension/shared/providers.js"></script>
  <script src="../extension/shared/config.js"></script>
  <script src="assert.js"></script>
  <script>
    const G = AIGuard;
    let activeConfig = G.normalizeConfig({ SsoPortalUrl: "https://myapps.microsoft.com", OrganizationName: "StratIT" });

    // Mock of the chrome APIs the content script uses.
    globalThis.chrome = {
      runtime: {
        lastError: undefined,
        sendMessage: (msg, cb) => setTimeout(() => cb({ config: activeConfig, source: "managed" }), 0),
      },
      storage: { onChanged: { addListener: () => {} } },
    };

    // Record which page handlers actually ran (i.e. were not blocked).
    const ran = [];
    document.getElementById("form1").addEventListener("submit", (e) => { e.preventDefault(); ran.push("form1"); });
    document.getElementById("continue2").addEventListener("click", () => ran.push("continue2"));
    for (const b of document.querySelectorAll("#sso button, #sso a")) {
      b.addEventListener("click", (e) => { e.preventDefault(); ran.push(b.id); });
    }
    const shadow = document.getElementById("shadowhost").attachShadow({ mode: "open" });
    shadow.innerHTML = '<input type="email" id="email3"><button id="submit3">Next</button>';
    shadow.getElementById("submit3").addEventListener("click", () => ran.push("submit3"));

    const $ = (id) => document.getElementById(id);
    const overlay = () => document.querySelector("ai-account-guard");
    const clearOverlay = () => overlay() && overlay().remove();
    function reset() {
      ran.length = 0;
      clearOverlay();
      for (const id of ["email1", "email2"]) $(id).value = "";
      shadow.getElementById("email3").value = "";
    }
    function expectBlocked(handlerId) {
      assert(!ran.includes(handlerId), `${handlerId} handler should NOT have run`);
      assert(overlay(), "block notice should be shown");
    }
    function expectAllowed(handlerId) {
      assert(ran.includes(handlerId), `${handlerId} handler should have run`);
      assert(!overlay(), "no block notice expected");
    }

    test("form: personal email blocked on submit-button click", () => {
      reset(); $("email1").value = "me@gmail.com"; $("submit1").click(); expectBlocked("form1");
    });
    test("form: work email allowed", () => {
      reset(); $("email1").value = "ben@stratitsolutions.com"; $("submit1").click(); expectAllowed("form1");
    });
    test("form: look-alike domain blocked", () => {
      reset(); $("email1").value = "ben@stratitsolutions.com.evil.io"; $("submit1").click(); expectBlocked("form1");
    });
    test("form: requestSubmit() with personal email blocked", () => {
      reset(); $("email1").value = "me@gmail.com"; $("form1").requestSubmit(); expectBlocked("form1");
    });
    test("form: Enter key in email field blocked", () => {
      reset(); $("email1").value = "me@yahoo.com";
      const ev = new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true, composed: true });
      $("email1").dispatchEvent(ev);
      assert(ev.defaultPrevented, "Enter should be prevented"); assert(overlay());
    });
    test("SPA: personal email blocked on role=button click", () => {
      reset(); $("email2").value = "me@outlook.com"; $("continue2").click(); expectBlocked("continue2");
    });
    test("SPA: work email (mixed case) allowed", () => {
      reset(); $("email2").value = "Ben@StratITSolutions.com"; $("continue2").click(); expectAllowed("continue2");
    });
    test("shadow DOM: personal email blocked", () => {
      reset(); shadow.getElementById("email3").value = "me@gmail.com"; shadow.getElementById("submit3").click(); expectBlocked("submit3");
    });
    test("SSO: Google allowed (tenant header restricts it)", () => { reset(); $("google").click(); expectAllowed("google"); });
    test("SSO: click on icon inside Google button still classified", () => {
      reset(); $("google").querySelector("svg").dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true })); expectAllowed("google");
    });
    test("SSO: Microsoft blocked without tenant id", () => { reset(); $("microsoft").click(); expectBlocked("microsoft"); });
    test("SSO: Apple blocked", () => { reset(); $("apple").click(); expectBlocked("apple"); });
    test("SSO: phone blocked", () => { reset(); $("phone").click(); expectBlocked("phone"); });
    test("SSO: X link blocked", () => { reset(); $("xlink").click(); expectBlocked("xlink"); });
    test("SSO: company SSO button allowed", () => { reset(); $("enterprise").click(); expectAllowed("enterprise"); });
    test("'Continue with email' is not treated as SSO", () => { reset(); $("emailbtn").click(); expectAllowed("emailbtn"); });
    test("unrelated buttons unaffected", () => { reset(); $("unrelated").click(); expectAllowed("unrelated"); });

    test("block notice shows portal link and escapes user input", () => {
      reset(); $("email1").value = "<img src=x onerror=alert(1)>@gmail.com"; $("submit1").click();
      const root = overlay().shadowRoot;
      assert(!root.querySelector("img"), "markup must not be injected");
      assert(root.textContent.includes("<img src=x"), "email shown as text");
      assertEqual(root.querySelector("a").href, "https://myapps.microsoft.com/");
      assert(root.textContent.includes("StratIT only allows ChatGPT"), "org + service named");
    });

    test("Microsoft allowed once tenant id configured", async () => {
      activeConfig = G.normalizeConfig({ AllowMicrosoftSignIn: true, MicrosoftTenantId: "tid" });
      await reloadConfig();
      reset(); $("microsoft").click(); expectAllowed("microsoft");
    });
    test("service mode 'off' disables checks", async () => {
      activeConfig = G.normalizeConfig({ ProviderModes: { chatgpt: "off" } });
      await reloadConfig();
      reset(); $("email1").value = "me@gmail.com"; $("submit1").click(); expectAllowed("form1");
    });

    // The content script listens for storage changes to reload config; the mock
    // captures that listener so tests can trigger it.
    let storageListener;
    chrome.storage.onChanged.addListener = (fn) => (storageListener = fn);
    async function reloadConfig() {
      storageListener({}, "managed");
      await new Promise((r) => setTimeout(r, 20));
    }

    // The notice uses a closed shadow root; force it open here so tests can inspect it.
    const attachShadow = Element.prototype.attachShadow;
    Element.prototype.attachShadow = function (opts) {
      return attachShadow.call(this, { ...opts, mode: "open" });
    };

    // Load the real content script with location.hostname faked as chatgpt.com.
    fetch("../extension/content/content.js").then((r) => r.text()).then((src) => {
      new Function("location", src)({ hostname: "chatgpt.com" });
      setTimeout(run, 50);
    });
  </script>
</body>
</html>
